<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The 420 System — Autonomous AI Business Platform</title>
    <meta name="description" content="The world's first fully autonomous, multi-tenant AI platform. Sales, Marketing, HR, Operations — unified as one intelligent organism." />
    <meta name="theme-color" content="#020008" />

    <!-- Open Graph.
         NOTE: this is a client-rendered SPA with no SSR, so crawlers only ever
         see THESE static tags for every route (they don't run our JS). The copy
         is therefore written to be true of both the product site and /videos.
         Image must be a raster format — the previous /og-image.svg was an SVG,
         which every major crawler ignores, and og:url pointed at a dead host. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OMEGA" />
    <meta property="og:title" content="OMEGA — watch it actually run" />
    <meta property="og:description" content="Screen recordings of a real business running itself: sales, marketing, communications, operations, finance and people, as one system. No mockups." />
    <meta property="og:image" content="https://omega.zatesystems.com/og-omega.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The OMEGA organization brain — a live constellation of every lead, customer and conversation." />
    <meta property="og:url" content="https://omega.zatesystems.com/videos" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OMEGA — watch it actually run" />
    <meta name="twitter:description" content="Screen recordings of a real business running itself: sales, marketing, communications, operations, finance and people, as one system. No mockups." />
    <meta name="twitter:image" content="https://omega.zatesystems.com/og-omega.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- OMEGA cinematic-v4 display/body faces (Fraunces hero + Hanken body) -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
